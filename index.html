<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obliant · CRM — protótipo</title>
<style>
  :root{
    --ink:#12181F; --paper:#F3F4EF; --panel:#FFFFFF; --panel-2:#F8F9F5;
    --accent:#748029; --accent-bright:#BCD848; --line:#DEE1D6; --muted:#5B6472;
    --hero-bg:#0C1119; --hero-text:#F3F4EF; --hero-line:rgba(243,244,239,.14); --hero-accent:#D6E878; --hero-muted:#9AA3AE;
    --ok:#2E7D32; --warn:#B45309; --bad:#B3261E;
    --font-head:Georgia,'Iowan Old Style','Palatino Linotype',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    --font-mono:ui-monospace,'SF Mono',Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#EDEFE7; --paper:#12161C; --panel:#191F27; --panel-2:#1E2530; --accent:#BCD848; --accent-bright:#D6E878; --line:#2B323C; --muted:#9AA3AE; --ok:#7CC47F; --warn:#F0B15E; --bad:#F09B94; }
  }
  :root[data-theme="dark"]{ --ink:#EDEFE7; --paper:#12161C; --panel:#191F27; --panel-2:#1E2530; --accent:#BCD848; --accent-bright:#D6E878; --line:#2B323C; --muted:#9AA3AE; --ok:#7CC47F; --warn:#F0B15E; --bad:#F09B94; }
  :root[data-theme="light"]{ --ink:#12181F; --paper:#F3F4EF; --panel:#FFFFFF; --panel-2:#F8F9F5; --accent:#748029; --accent-bright:#BCD848; --line:#DEE1D6; --muted:#5B6472; --ok:#2E7D32; --warn:#B45309; --bad:#B3261E; }

  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-variant-numeric:tabular-nums}

  /* ---------- Topo ---------- */
  .top{background:var(--hero-bg);color:var(--hero-text);padding:16px 22px}
  .top-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .mark{width:28px;height:28px;border-radius:7px;background:var(--hero-accent);flex:0 0 auto}
  .brandt strong{display:block;font-family:var(--font-head);font-size:16px}
  .brandt span{display:block;font-size:11px;color:var(--hero-muted);margin-top:1px}
  .top .proto{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .top label{font-family:var(--font-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--hero-muted)}
  select{font-family:var(--font-body);font-size:13px;padding:7px 11px;border-radius:8px;border:1px solid var(--hero-line);
    background:rgba(243,244,239,.06);color:var(--hero-text)}
  select option{background:#1a1f28;color:#F3F4EF}

  /* ---------- Abas ---------- */
  .abas{background:var(--panel);border-bottom:1px solid var(--line);padding:0 22px;overflow-x:auto}
  .abas-in{max-width:1400px;margin:0 auto;display:flex;gap:4px}
  .abas button{appearance:none;background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;
    font-family:var(--font-body);font-size:13.5px;font-weight:600;color:var(--muted);padding:13px 15px;cursor:pointer;white-space:nowrap}
  .abas button:hover{color:var(--ink)}
  .abas button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .abas button .cnt{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-left:5px}

  /* ---------- Área ---------- */
  .wrap{max-width:1400px;margin:0 auto;padding:20px 22px 60px}
  .areahead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
  .areahead h2{font-family:var(--font-head);font-weight:400;font-size:22px;margin:0}
  .areahead .dono{font-size:12.5px;color:var(--muted)}
  .areasub{font-size:12.5px;color:var(--muted);margin:0 0 18px;max-width:70ch;line-height:1.55}

  /* ---------- Kanban ---------- */
  .board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
  .col{flex:0 0 262px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:72vh}
  .col-h{padding:11px 13px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel-2);border-radius:12px 12px 0 0}
  .col-h .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .col-h b{font-size:12.5px}
  .col-h .n{font-family:var(--font-mono);font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
  .col-h .v{font-family:var(--font-mono);font-size:11px;color:var(--accent);margin-top:4px;font-weight:700}
  .col.win .col-h{border-bottom-color:var(--ok)} .col.win .col-h b{color:var(--ok)}
  .col.lose .col-h{border-bottom-color:var(--bad)} .col.lose .col-h b{color:var(--bad)}
  .col-b{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:9px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;text-align:left;width:100%;font-family:inherit}
  .card:hover{border-color:var(--accent)}
  .card .emp{font-size:13px;font-weight:600;line-height:1.3;display:block}
  .card .ct{font-size:11.5px;color:var(--muted);margin-top:2px;display:block}
  .card .val{font-family:var(--font-mono);font-size:12.5px;color:var(--accent);font-weight:700;margin-top:7px;display:block}
  .card .foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line)}
  .tagx{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:999px;white-space:nowrap}
  .o-pago{background:rgba(188,216,72,.25);color:var(--accent)}
  .o-indic{background:rgba(37,99,235,.13);color:#2563EB}
  .o-prosp{background:rgba(180,83,9,.13);color:var(--warn)}
  .o-site{background:rgba(91,100,114,.15);color:var(--muted)}
  .idade{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
  .idade.alerta{color:var(--warn);font-weight:700}
  .vazio{font-size:12px;color:var(--muted);padding:14px 4px;text-align:center;font-style:italic}

  /* ---------- Consolidado ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:22px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 17px}
  .kpi .k{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .kpi .v{font-family:var(--font-mono);font-size:23px;font-weight:700;color:var(--accent);margin-top:5px}
  .kpi .s{font-size:11.5px;color:var(--muted);margin-top:3px}
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
  th{text-align:left;font-family:var(--font-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
  tr:last-child td{border-bottom:0}
  td.num{font-family:var(--font-mono);text-align:right;white-space:nowrap}

  /* ---------- Painel lateral ---------- */
  .ov{position:fixed;inset:0;background:rgba(12,17,25,.5);display:none;z-index:60}
  .ov.on{display:block}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--paper);border-left:1px solid var(--line);
    z-index:61;transform:translateX(100%);transition:transform .18s ease;overflow-y:auto}
  .drawer.on{transform:translateX(0)}
  .dr-h{background:var(--hero-bg);color:var(--hero-text);padding:18px 22px}
  .dr-h .et{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--hero-accent)}
  .dr-h h3{font-family:var(--font-head);font-weight:400;font-size:21px;margin:6px 0 3px}
  .dr-h .sub{font-size:12.5px;color:var(--hero-muted)}
  .dr-b{padding:18px 22px 40px}
  .campo{display:grid;grid-template-columns:132px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .campo b{font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:2px}
  .fechar{appearance:none;background:transparent;border:1px solid var(--hero-line);color:var(--hero-text);border-radius:8px;
    padding:5px 11px;font-size:12px;cursor:pointer;float:right;font-family:inherit}

  /* ---------- Botoes e formulario ---------- */
  .btn{appearance:none;font-family:inherit;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primario{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primario:hover{opacity:.9;color:#fff}
  .btn.perigo{color:var(--bad)}
  .btn.perigo:hover{border-color:var(--bad);color:var(--bad)}
  .areahead{align-items:center}

  .fmp{display:block;margin-bottom:13px}
  .fmp b{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px}
  .fmp input, .fmp select{width:100%;font-family:var(--font-body);font-size:13.5px;padding:9px 11px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .fmp input:focus, .fmp select:focus{outline:none;border-color:var(--accent)}
  .acoes{display:flex;gap:9px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
  .avisof{font-size:11.5px;color:var(--muted);line-height:1.5;margin:14px 0 0}
  .card[draggable="true"]{cursor:grab}
  .card[draggable="true"]:active{cursor:grabbing}

  /* ---------- Nota ---------- */
  .nota{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent-bright);border-radius:0 12px 12px 0;padding:16px 20px;margin-top:26px}
  .nota b.lbl{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
  .nota p{margin:0 0 8px;font-size:13px;line-height:1.6}
  .nota p:last-child{margin-bottom:0}

  @media (max-width:720px){ .wrap{padding:16px 14px 50px} .abas{padding:0 14px} .top{padding:14px} }
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div class="mark"></div>
    <div class="brandt"><strong>Obliant · CRM</strong><span>Protótipo de conceito — dados fictícios</span></div>
    <div class="proto">
      <label for="papel">Simular acesso como</label>
      <select id="papel" onchange="setPapel(this.value)">
        <option value="admin">Admin</option>
        <option value="smb">Gestor SMB</option>
        <option value="le">Gestor Large Enterprise</option>
        <option value="aloc">Gestor Alocação</option>
      </select>
    </div>
  </div>
</div>

<div class="abas"><div class="abas-in" id="abas"></div></div>

<div class="wrap" id="conteudo"></div>

<div class="ov" id="ov" onclick="fechar()"></div>
<aside class="drawer" id="drawer">
  <div class="dr-h">
    <button class="fechar" onclick="fechar()">Fechar</button>
    <div class="et" id="drEt"></div>
    <h3 id="drTit"></h3>
    <div class="sub" id="drSub"></div>
  </div>
  <div class="dr-b" id="drB"></div>
</aside>

<script>

};

var NEG = [
  // --- Entrada ---

  {id:2, area:'entrada', etapa:'novo', empresa:'Grupo Andrade Log', contato:'Camila Bueno', cargo:'Head de Projetos', fat:'Acima de R$ 500 mi', origem:'pago', campanha:'escritorio-de-projetos', entrou:'2026-08-10', sugestao:'Large Enterprise', prox:'Primeiro contato', proxData:'2026-08-11'},
  {id:3, area:'entrada', etapa:'contato', empresa:'Nutrisul Alimentos', contato:'Diego Ramos', cargo:'Gerente de PMO', fat:'R$ 50 a 200 mi', origem:'site', campanha:'—', entrou:'2026-08-08', sugestao:'SMB', prox:'Reunião de triagem', proxData:'2026-08-12'},

  // --- SMB ---
  {id:10, area:'smb', etapa:'qualificado', empresa:'Cerâmica Bandeirante', contato:'Otávio Lins', cargo:'Diretor de TI', fat:'R$ 200 a 500 mi', origem:'pago', valor:86000, entrou:'2026-08-07', prox:'Agendar diagnóstico', proxData:'2026-08-13'},

var ORIGEM = { pago:['Tráfego pago','o-pago'], indic:['Indicação','o-indic'], prosp:['Prospecção','o-prosp'], site:['Site','o-site'] };
var FAIXAS = ['Até R$ 50 mi','R$ 50 a 200 mi','R$ 200 a 500 mi','Acima de R$ 500 mi'];

var EXEMPLOS = JSON.parse(JSON.stringify(NEG));
var CHAVE = 'obliant_crm_proto_v1';

function carregar(){
  try {
    var s = localStorage.getItem(CHAVE);
    if (s) { var d = JSON.parse(s); if (d && d.length) NEG = d; }
  } catch(e) {}
}
function salvar(){
  try { localStorage.setItem(CHAVE, JSON.stringify(NEG)); } catch(e) {}
}
function restaurar(){
  if (!confirm('Isto apaga tudo que você criou e volta aos exemplos. Continuar?')) return;
  NEG = JSON.parse(JSON.stringify(EXEMPLOS));
  salvar(); render();
}
function proximoId(){
  var m = 0; NEG.forEach(function(n){ if (n.id > m) m = n.id; }); return m + 1;
}

var papel = 'admin';
var abaAtual = 'entrada';
var editando = null;

function brl(n){ return 'R$ ' + Math.round(n).toLocaleString('pt-BR'); }
function dias(iso){ if(!iso||iso==='—') return null; var p=iso.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); return Math.round((HOJE-d)/86400000); }
function dataBR(iso){ if(!iso||iso==='—') return '—'; var p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function valorDe(n){ return n.mensal ? n.mensal*(n.meses||1) : (n.valor||0); }

function areasVisiveis(){
  var r=[]; for (var k in AREAS) { if (AREAS[k].papeis.indexOf(papel) >= 0) r.push(k); } return r;
}

function setPapel(p){
  papel = p;
  var vis = areasVisiveis();
  if (vis.indexOf(abaAtual) < 0) abaAtual = vis[0];
  render();
}

function irPara(a){ abaAtual = a; render(); }

function render(){
  var vis = areasVisiveis();
  var ab = document.getElementById('abas'); ab.innerHTML='';
  vis.forEach(function(k){
    var n = NEG.filter(function(x){ return x.area===k; }).length;
    var b = document.createElement('button');
    b.className = (k===abaAtual?'on':'');
    b.innerHTML = AREAS[k].nome + '<span class="cnt">' + n + '</span>';
    b.onclick = function(){ irPara(k); };
    ab.appendChild(b);
  });
  if (papel === 'admin') {
    var b2 = document.createElement('button');
    b2.className = (abaAtual==='consolidado'?'on':'');
    b2.textContent = 'Consolidado';
    b2.onclick = function(){ irPara('consolidado'); };
    ab.appendChild(b2);
  }
  if (abaAtual === 'consolidado') renderConsolidado(); else renderBoard(abaAtual);
}

function renderBoard(ak){
  var A = AREAS[ak];
  var h = '<div class="areahead"><h2>'+A.nome+'</h2><span class="dono">Responsável: '+A.dono+'</span>';
  h += '<span style="margin-left:auto;display:flex;gap:8px">';
  h += '<button class="btn primario" onclick="novo(\''+ak+'\')">+ Novo</button>';
  h += '<button class="btn" onclick="restaurar()">Restaurar exemplos</button>';
  h += '</span></div>';
  h += '<p class="areasub">'+A.sub+'</p><div class="board">';
  A.etapas.forEach(function(et){
    var itens = NEG.filter(function(n){ return n.area===ak && n.etapa===et.id; });
    var soma = itens.reduce(function(s,n){ return s + valorDe(n); }, 0);
    h += '<div class="col'+(et.win?' win':'')+(et.lose?' lose':'')+'" ondragover="permitir(event)" ondrop="soltar(event,\''+et.id+'\')">';
    h += '<div class="col-h"><div class="t"><b>'+et.nome+'</b><span class="n">'+itens.length+'</span></div>';
    if (ak !== 'entrada' && soma > 0) h += '<div class="v">'+brl(soma)+'</div>';
    h += '</div><div class="col-b">';
    if (!itens.length) h += '<div class="vazio">arraste um card para cá</div>';
    itens.forEach(function(n){
      var o = ORIGEM[n.origem] || ['—','o-site'];
      var d = dias(n.entrou);
      var alerta = (d !== null && d > 20 && !et.win && !et.lose);
      h += '<button class="card" draggable="true" ondragstart="pegar(event,'+n.id+')" onclick="abrir('+n.id+')">';
      h += '<span class="emp">'+n.empresa+'</span>';
      h += '<span class="ct">'+n.contato+(n.cargo && n.cargo!=='—' ? ' · '+n.cargo : '')+'</span>';
      if (ak === 'entrada') { if (n.sugestao && n.sugestao!=='—') h += '<span class="val">→ '+n.sugestao+'</span>'; }
      else if (n.mensal) h += '<span class="val">'+brl(n.mensal)+'/mês · '+n.meses+'m</span>';
      else if (n.valor) h += '<span class="val">'+brl(n.valor)+'</span>';
      h += '<span class="foot"><span class="tagx '+o[1]+'">'+o[0]+'</span>';
      if (d !== null) h += '<span class="idade'+(alerta?' alerta':'')+'">'+d+'d</span>';
      h += '</span></button>';
    });
    h += '</div></div>';
  });
  h += '</div>';
  h += notaDaArea(ak);
  document.getElementById('conteudo').innerHTML = h;
}

function notaDaArea(ak){
  if (ak === 'entrada') return '<div class="nota"><b class="lbl">Por que existe esta camada</b><p>Lead cru não deve entrar no funil comercial — polui a previsão e faz o gestor perder tempo com quem não tem perfil. Aqui ele é avaliado, e só o que tem perfil vira negócio.</p><p><b>O destino é sugerido automaticamente</b> pela faixa de faturamento informada no formulário: até R$ 500 milhões vai para SMB, acima vai para Large Enterprise. A triagem confirma ou corrige.</p><p>O número em cinza é <b>há quantos dias o lead está parado</b>. Passou de 20, fica laranja — em tráfego pago, lead frio custa o mesmo que lead quente e converte muito menos.</p></div>';
  if (ak === 'aloc') return '<div class="nota"><b class="lbl">Por que alocação tem valor mensal</b><p>Alocação é receita recorrente. Se registrar o valor cheio do contrato, uma alocação de R$ 18 mil por 12 meses aparece como R$ 216 mil competindo com um projeto de R$ 86 mil que acontece uma vez — e a previsão perde o sentido.</p><p>Por isso o card mostra <b>valor mensal e duração</b>, e a etapa final é <b>Ativo</b>, não "Ganho": o contrato continua vivo, com data de renovação. Perder uma renovação dói mais do que não ganhar uma proposta nova, porque é receita que já era sua.</p></div>';
  return '<div class="nota"><b class="lbl">Sobre as etapas</b><p>Usei <b>Ganho</b> e <b>Perdido</b> em vez de "Concluído". Os dois são conclusões — e um funil que junta os dois esconde exatamente o número que interessa, que é a taxa de conversão.</p><p>O <b>Perdido</b> guarda o motivo. Depois de vinte negócios perdidos, o padrão dos motivos vale mais que qualquer relatório: mostra se o problema é preço, timing, concorrente ou qualificação errada lá atrás.</p></div>';
}

function renderConsolidado(){
  var abertas = NEG.filter(function(n){ return n.area!=='entrada' && ['ganho','perdido','ativo'].indexOf(n.etapa)<0; });
  var previsto = abertas.reduce(function(s,n){ return s+valorDe(n); },0);
  var ganhos = NEG.filter(function(n){ return n.etapa==='ganho'||n.etapa==='ativo'; });
  var receita = ganhos.reduce(function(s,n){ return s+valorDe(n); },0);
  var leads = NEG.filter(function(n){ return n.area==='entrada'; }).length;
  var pagos = NEG.filter(function(n){ return n.origem==='pago'; }).length;

  var h = '<div class="areahead"><h2>Consolidado</h2><span class="dono">Visível apenas para Admin e CEO</span></div>';
  h += '<p class="areasub">Visão que ninguém mais tem: as três áreas somadas, mais o desempenho por origem.</p>';
  h += '<div class="kpis">';
  h += '<div class="kpi"><div class="k">Receita prevista</div><div class="v">'+brl(previsto)+'</div><div class="s">'+abertas.length+' negócios em aberto</div></div>';
  h += '<div class="kpi"><div class="k">Fechado no período</div><div class="v">'+brl(receita)+'</div><div class="s">'+ganhos.length+' ganhos e ativos</div></div>';
  h += '<div class="kpi"><div class="k">Leads na entrada</div><div class="v">'+leads+'</div><div class="s">aguardando triagem ou já direcionados</div></div>';
  h += '<div class="kpi"><div class="k">Originados por mídia paga</div><div class="v">'+pagos+'</div><div class="s">de '+NEG.length+' registros</div></div>';
  h += '</div>';

  h += '<div class="tw"><table><thead><tr><th>Área</th><th>Em aberto</th><th class="num">Previsto</th><th>Ganhos</th><th class="num">Fechado</th></tr></thead><tbody>';
  ['smb','le','aloc'].forEach(function(k){
    var ab = NEG.filter(function(n){ return n.area===k && ['ganho','perdido','ativo'].indexOf(n.etapa)<0; });
    var gn = NEG.filter(function(n){ return n.area===k && (n.etapa==='ganho'||n.etapa==='ativo'); });
    h += '<tr><td><b>'+AREAS[k].nome+'</b></td><td>'+ab.length+'</td><td class="num">'+brl(ab.reduce(function(s,n){return s+valorDe(n);},0))+'</td><td>'+gn.length+'</td><td class="num">'+brl(gn.reduce(function(s,n){return s+valorDe(n);},0))+'</td></tr>';
  });
  h += '</tbody></table></div>';

  h += '<div style="height:22px"></div><div class="tw"><table><thead><tr><th>Origem</th><th>Registros</th><th class="num">Previsto</th><th class="num">Fechado</th></tr></thead><tbody>';
  ['pago','indic','prosp','site'].forEach(function(o){
    var t = NEG.filter(function(n){ return n.origem===o; });
    var ab = t.filter(function(n){ return n.area!=='entrada' && ['ganho','perdido','ativo'].indexOf(n.etapa)<0; });
    var gn = t.filter(function(n){ return n.etapa==='ganho'||n.etapa==='ativo'; });
    h += '<tr><td><span class="tagx '+ORIGEM[o][1]+'">'+ORIGEM[o][0]+'</span></td><td>'+t.length+'</td><td class="num">'+brl(ab.reduce(function(s,n){return s+valorDe(n);},0))+'</td><td class="num">'+brl(gn.reduce(function(s,n){return s+valorDe(n);},0))+'</td></tr>';
  });
  h += '</tbody></table></div>';

  h += '<div class="nota"><b class="lbl">É esta tabela que responde o piloto de tráfego pago</b><p>Com a origem gravada em cada registro, o custo por lead e o custo por cliente saem sozinhos: investimento do mês dividido pelos leads da linha "Tráfego pago", e depois pelos negócios ganhos vindos dela.</p><p>Hoje, sem isso, essa conta é feita à mão — e por isso quase nunca é feita.</p></div>';

  document.getElementById('conteudo').innerHTML = h;
}

function abrir(id){
  var n = NEG.filter(function(x){ return x.id===id; })[0];
  if (!n) return;
  var A = AREAS[n.area];
  var et = A.etapas.filter(function(e){ return e.id===n.etapa; })[0];
  document.getElementById('drEt').textContent = A.nome + ' · ' + (et?et.nome:'');
  document.getElementById('drTit').textContent = n.empresa;
  document.getElementById('drSub').textContent = n.contato + (n.cargo && n.cargo!=='—' ? ' · ' + n.cargo : '');

  var c = '';
  function campo(k,v){ if(v===undefined||v===null||v==='') return; c += '<div class="campo"><b>'+k+'</b><span>'+v+'</span></div>'; }
  campo('Empresa', n.empresa);
  campo('Contato', n.contato);
  campo('Cargo', n.cargo);
  campo('Faturamento', n.fat);
  if (n.area === 'entrada') {
    campo('Destino sugerido', n.sugestao);
    campo('Campanha', n.campanha);
  } else if (n.mensal) {
    campo('Valor mensal', brl(n.mensal));
    campo('Duração', n.meses + ' meses');
    campo('Valor total', brl(n.mensal*n.meses));
    campo('Renovação', dataBR(n.renovacao));
  } else {
    campo('Valor', brl(n.valor||0));
  }
  campo('Origem', (ORIGEM[n.origem]||['—'])[0]);
  campo('Entrou na etapa', dataBR(n.entrou) + (dias(n.entrou)!==null ? ' · há '+dias(n.entrou)+' dias' : ''));
  campo('Próximo passo', n.prox);
  campo('Data do próximo passo', dataBR(n.proxData));
  campo('Motivo da perda', n.motivo);
  c += '<div class="acoes"><button class="btn primario" onclick="editar('+n.id+')">Editar</button>';
  c += '<button class="btn perigo" onclick="excluir('+n.id+')">Excluir</button></div>';
  document.getElementById('drB').innerHTML = c;

  document.getElementById('ov').classList.add('on');
  document.getElementById('drawer').classList.add('on');
}

// ---------- Criar e editar ----------
function novo(area){
  editar(null, area);
}

function editar(id, area){
  var n = id ? NEG.filter(function(x){ return x.id===id; })[0] : null;
  var ak = n ? n.area : area;
  var A = AREAS[ak];
  editando = n ? n.id : null;

  document.getElementById('drEt').textContent = A.nome;
  document.getElementById('drTit').textContent = n ? 'Editar' : 'Novo registro';
  document.getElementById('drSub').textContent = n ? n.empresa : 'Preencha os campos abaixo';

  function txt(id,rot,val,ph){ return '<label class="fmp"><b>'+rot+'</b><input id="f_'+id+'" type="text" value="'+(val||'').replace(/"/g,'&quot;')+'" placeholder="'+(ph||'')+'"></label>'; }
  function num(id,rot,val){ return '<label class="fmp"><b>'+rot+'</b><input id="f_'+id+'" type="number" value="'+(val!==undefined&&val!==null?val:'')+'"></label>'; }
  function dat(id,rot,val){ return '<label class="fmp"><b>'+rot+'</b><input id="f_'+id+'" type="date" value="'+(val&&val!=='—'?val:'')+'"></label>'; }
  function sel(id,rot,ops,val){
    var s = '<label class="fmp"><b>'+rot+'</b><select id="f_'+id+'">';
    ops.forEach(function(o){ var v=o[0], t=o[1]; s += '<option value="'+v+'"'+(v===val?' selected':'')+'>'+t+'</option>'; });
    return s + '</select></label>';
  }

  var c = '';
  c += sel('etapa','Etapa', A.etapas.map(function(e){ return [e.id, e.nome]; }), n ? n.etapa : A.etapas[0].id);
  c += txt('empresa','Empresa', n?n.empresa:'', 'Razão social ou nome fantasia');
  c += txt('contato','Contato', n?n.contato:'', 'Nome da pessoa');
  c += txt('cargo','Cargo', n?n.cargo:'', 'Ex.: Diretor de Operações');
  c += sel('fat','Faixa de faturamento', FAIXAS.map(function(f){ return [f,f]; }), n?n.fat:FAIXAS[2]);
  c += sel('origem','Origem', Object.keys(ORIGEM).map(function(k){ return [k, ORIGEM[k][0]]; }), n?n.origem:'pago');

  if (ak === 'entrada') {
    c += sel('sugestao','Destino sugerido', [['SMB','SMB'],['Large Enterprise','Large Enterprise'],['Alocação','Alocação'],['—','—']], n?n.sugestao:'SMB');
    c += txt('campanha','Campanha / palavra-chave', n?n.campanha:'', 'ex.: pmo-terceirizado / exata');
  } else if (ak === 'aloc') {
    c += num('mensal','Valor mensal (R$)', n?n.mensal:'');
    c += num('meses','Duração (meses)', n?n.meses:12);
    c += dat('renovacao','Data de renovação', n?n.renovacao:'');
  } else {
    c += num('valor','Valor (R$)', n?n.valor:'');
  }

  c += dat('entrou','Entrou na etapa', n?n.entrou:'2026-08-11');
  c += txt('prox','Próximo passo', n?n.prox:'', 'O que precisa acontecer');
  c += dat('proxData','Data do próximo passo', n?n.proxData:'');
  c += txt('motivo','Motivo da perda', n?n.motivo:'', 'Preencher só se Perdido');

  c += '<div class="acoes"><button class="btn primario" onclick="gravar(\''+ak+'\')">Salvar</button>';
  c += '<button class="btn" onclick="fechar()">Cancelar</button></div>';
  c += '<p class="avisof">Fica salvo apenas neste navegador. É protótipo — não há banco por trás, e quem abrir o link não verá o que você criou.</p>';

  document.getElementById('drB').innerHTML = c;
  document.getElementById('ov').classList.add('on');
  document.getElementById('drawer').classList.add('on');
}

function v(id){ var e = document.getElementById('f_'+id); return e ? e.value.trim() : ''; }
function vnum(id){ var x = v(id); return x === '' ? undefined : Number(x); }

function gravar(ak){
  if (!v('empresa')) { alert('Informe ao menos a empresa.'); return; }
  var n = editando ? NEG.filter(function(x){ return x.id===editando; })[0] : { id: proximoId(), area: ak };
  n.area = ak;
  n.etapa = v('etapa');
  n.empresa = v('empresa');
  n.contato = v('contato') || '—';
  n.cargo = v('cargo');
  n.fat = v('fat');
  n.origem = v('origem');
  if (ak === 'entrada') { n.sugestao = v('sugestao'); n.campanha = v('campanha') || '—'; }
  else if (ak === 'aloc') { n.mensal = vnum('mensal'); n.meses = vnum('meses') || 12; n.renovacao = v('renovacao'); }
  else { n.valor = vnum('valor'); }
  n.entrou = v('entrou');
  n.prox = v('prox') || '—';
  n.proxData = v('proxData');
  n.motivo = v('motivo');
  if (!editando) NEG.push(n);
  editando = null;
  salvar(); fechar(); render();
}

function excluir(id){
  if (!confirm('Excluir este registro?')) return;
  NEG = NEG.filter(function(x){ return x.id !== id; });
  salvar(); fechar(); render();
}

// ---------- Arrastar entre etapas ----------
var arrastando = null;
function pegar(ev, id){ arrastando = id; if (ev.dataTransfer) { ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', String(id)); } }
function permitir(ev){ ev.preventDefault(); if (ev.dataTransfer) ev.dataTransfer.dropEffect = 'move'; }
function soltar(ev, etapa){
  ev.preventDefault();
  var id = arrastando || Number(ev.dataTransfer && ev.dataTransfer.getData('text/plain'));
  var n = NEG.filter(function(x){ return x.id === id; })[0];
  arrastando = null;
  if (!n || n.etapa === etapa) return;
  n.etapa = etapa;
  n.entrou = '2026-08-11';
  salvar(); render();
}
function fechar(){
  document.getElementById('ov').classList.remove('on');
  document.getElementById('drawer').classList.remove('on');
}
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') fechar(); });

carregar();
render();
</script>
</body>
</html>
